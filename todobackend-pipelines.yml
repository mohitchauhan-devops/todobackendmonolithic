trigger: none

pool: powermanage-pool

stages:
- stage: Build
  displayName: Build & Code Quality
  jobs:
  - job: BuildPythonApp
    displayName:  Build Python Application
    steps:  
    
    - task: PowerShell@2
      displayName: Check Python Version & Install Lint Tool
      inputs:
        targetType: 'inline'
        script: |
          python --version
          pip install ruff

    - task: PowerShell@2
      displayName: Run Python Linting (Ruff)
      inputs:
        targetType: 'inline'
        script: |
          python -m ruff --version
          python -m ruff check app.py

